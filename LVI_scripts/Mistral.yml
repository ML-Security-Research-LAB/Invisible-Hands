system:
  device: cuda
  pipeline:
    enable_pipeline: false
    pipeline_nodes: [ 0,1 ]
    size_mbs: 2

model:
  name: mistralai/Mistral-7B-v0.3
  alias: &global_model_name Mistral-7B-LVI
  torch_dtype: float16    
  model_peft: false
  load_in_8bit: false
  load_in_4bit: false

task:
  seed: 0
  task_mode: flip
  flip:
    flip_dataset:
      type: downstream  
      name: arc_easy 
      seq_len: 256
    flip_metric: BFA
    func_name: detect_critical_layer
    custom_flip: true
    custom_config:
      custom_package_location: ./Flippers
  output_folder: &output_folder !join ['./Expermintal_Results', '/', *global_model_name ]

evaluation:
  lm_eval: false
  lm_eval_options:
    output_path: *output_folder
    tasks: [ "mmlu","openbookqa", "arc_easy", "winogrande", "hellaswag", "arc_challenge", "piqa", "boolq" ]
    num_fewshot: 0
    batch_size: auto
    max_length: 5120
  ppl: false
  ppl_options:
    output_path: *output_folder

report:
  use_logger: false
  logger:
    log_file_path: !join [ *output_folder, '/', *global_model_name, '.txt' ]



